<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #231f20;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }

      /* Le jeu est conçu en portrait : on garde un format 9:16 centré
         (bandes sur les côtés sur un écran d'ordinateur, plein écran sur téléphone). */
      #unity-container {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #231f20;
        outline: none;
      }

      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        color: #f2dccb;
        font-family: sans-serif;
        font-size: 18px;
      }

      #progress {
        width: 60%;
        height: 10px;
        border-radius: 5px;
        background: #4a3a36;
        overflow: hidden;
      }

      #progress-fill {
        width: 0%;
        height: 100%;
        background: #8a2a1c;
        transition: width 0.2s;
      }

      #fullscreen {
        position: absolute;
        right: 10px;
        bottom: 10px;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.45);
        color: #f2dccb;
        font-size: 22px;
        cursor: pointer;
        display: none;
      }

      #error {
        position: absolute;
        left: 10px;
        right: 10px;
        top: 10px;
        padding: 10px;
        border-radius: 8px;
        background: #8a2a1c;
        color: white;
        font-family: sans-serif;
        font-size: 14px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading">
        <div>Chargement…</div>
        <div id="progress"><div id="progress-fill"></div></div>
      </div>
      <button id="fullscreen" title="Plein écran">⛶</button>
    </div>
    <div id="error"></div>

    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var progressFill = document.querySelector("#progress-fill");
      var fullscreenButton = document.querySelector("#fullscreen");
      var errorBox = document.querySelector("#error");

      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      // Format portrait le plus grand possible dans la fenêtre (ou l'iframe itch.io).
      // Sur téléphone, on prend tout l'écran : l'interface s'adapte à la largeur.
      function resize() {
        var w = window.innerWidth;
        var h = window.innerHeight;

        if (isMobile) {
          container.style.width = w + "px";
          container.style.height = h + "px";
          return;
        }

        var ratio = 9 / 16;
        var width = Math.min(w, h * ratio);
        container.style.width = Math.floor(width) + "px";
        container.style.height = Math.floor(width / ratio) + "px";
      }

      window.addEventListener("resize", resize);
      resize();

      function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = "block";
      }

      var config = {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: function (message, type) {
          if (type === "error")
            showError(message);
          else
            console.warn(message);
        },
      };

      createUnityInstance(canvas, config, function (progress) {
        progressFill.style.width = (100 * progress) + "%";
      }).then(function (unityInstance) {
        loading.style.display = "none";

        // Sur téléphone, itch.io ouvre déjà le jeu en plein écran.
        if (!isMobile) {
          fullscreenButton.style.display = "block";
          // Plein écran de toute la page (et non du canvas seul) pour garder le format portrait.
          fullscreenButton.onclick = function () {
            if (document.fullscreenElement)
              document.exitFullscreen();
            else if (document.documentElement.requestFullscreen)
              document.documentElement.requestFullscreen();
          };
        }
      }).catch(function (message) {
        showError("Impossible de lancer le jeu : " + message);
      });
    </script>
  </body>
</html>
